# conda env create --file requirements.yml
#
# Launch Jupyter from this environment: the widget frontend has to be where Jupyter is *served*,
# not merely where the kernel runs, or the notebooks print `IntSlider(value=0, ...)` instead of a
# slider.
name: topepan
channels:
  - conda-forge
dependencies:
  - python>=3.10

  # Data handling, and what coeus needs to read an Omphalos results.nc.
  - numpy
  - pandas
  - xarray
  - netcdf4

  # Plotting. ipympl backs the `%matplotlib ipympl` line the notebooks use.
  - matplotlib
  - ipympl

  # Serving and running notebooks.
  - jupyterlab
  - notebook
  - ipykernel
  - nb_conda_kernels

  # Widgets: ipywidgets for the kernel side, jupyterlab_widgets for the frontend.
  - ipywidgets>=8
  - jupyterlab_widgets>=3

  # Omphalos itself, so one environment both runs sweeps and browses them. Its own
  # requirements.yml stays free of the notebook stack to remain installable on a headless cluster,
  # so this file is the superset.
  - f90nml
  - pyyaml
  - pexpect

  # Left out as optional: parallel (rhea's non-default backend), pytest (Omphalos's test suite),
  # pygcc (recomputing database log K columns).
